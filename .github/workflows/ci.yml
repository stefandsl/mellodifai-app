name: CI

on:
  push:
    branches: [main, build/m1-agent-access]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MELLODIFAI_ROOT: ${{ runner.temp }}/mellodifai
    outputs:
      has-supabase-config: ${{ steps.supabase-config.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Supabase config
        id: supabase-config
        run: echo "exists=${{ hashFiles('supabase/config.toml') != '' }}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ops check-no-keys.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm test

  db:
    needs: checks
    if: needs.checks.outputs.has-supabase-config == 'true'
    runs-on: ubuntu-latest
    env:
      MELLODIFAI_ROOT: ${{ runner.temp }}/mellodifai
      WORKER_FAKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ops check-no-keys.ts
      - run: pnpm ops stack.ts render --env ci
      # Stack startup deliberately uses --pull never. Fetch the rendered pins first.
      - run: docker compose -p mellodifai_ci -f "$RUNNER_TEMP/stack/compose.json" pull
      - run: pnpm ops stack.ts start --env ci
      - name: Export local Supabase environment
        run: |
          set +x
          env_file="$(pnpm -s ops stack.ts env-file --env ci)"
          set -a
          source "$env_file"
          set +a
          while IFS='=' read -r name _; do
            value="${!name}"
            mask="${value//'%'/'%25'}"
            mask="${mask//$'\r'/'%0D'}"
            mask="${mask//$'\n'/'%0A'}"
            printf '::add-mask::%s\n' "$mask"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < "$env_file"
      - run: pnpm test:db
      - run: pnpm test:integration
      - run: pnpm --filter @mellodifai/web exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm e2e
        env:
          E2E_ALLOW_LIVE_STACK: "1"
