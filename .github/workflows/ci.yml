name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      has-supabase-config: ${{ steps.supabase-config.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Supabase config
        id: supabase-config
        run: echo "exists=${{ hashFiles('supabase/config.toml') != '' }}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db:
    needs: checks
    if: needs.checks.outputs.has-supabase-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - run: pnpm test:db
      - name: Export local Supabase environment
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-$API_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-$ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter @mellodifai/web exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm e2e
