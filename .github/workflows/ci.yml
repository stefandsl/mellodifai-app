name: CI

on:
  push:
    branches: [main, build/m1-agent-access]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      WORKER_FAKE: "1"
      MELLODIFAI_RUNTIME: native
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Keep runtime and caches off C
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mellodifai-native'
          if ([IO.Path]::GetPathRoot($root) -eq 'C:\') {
            throw 'Native CI requires a non-C runtime volume.'
          }
          New-Item -ItemType Directory -Force "$root/tmp", "$root/cache" | Out-Null
          @{
            MELLODIFAI_ROOT = $root
            RUNNER_TEMP = $root
            TEMP = "$root/tmp"
            TMP = "$root/tmp"
            TMPDIR = "$root/tmp"
            npm_config_cache = "$root/cache/npm"
            npm_config_store_dir = "$root/cache/pnpm"
            GOCACHE = "$root/cache/go/build"
            GOMODCACHE = "$root/cache/go/mod"
            GOPATH = "$root/cache/go/path"
            PLAYWRIGHT_BROWSERS_PATH = "$root/cache/playwright"
            E2E_SCREENSHOT_DIR = "$root/test-results/screens"
          }.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" >> $env:GITHUB_ENV }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm ops check-no-keys.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @mellodifai/web exec tsc --noEmit
      - name: Check installed media prerequisite
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw 'Native tests require ffmpeg on PATH. No pinned FFmpeg publisher artifact is in manifest.json yet; refusing an unpinned download.'
          }
      - run: pnpm --filter @mellodifai/web exec playwright install chromium
      - run: pnpm test
      - name: Reserve isolated browser ports
        run: |
          'E2E_PORT=3234' >> $env:GITHUB_ENV
          'E2E_AUTH_PORT=3235' >> $env:GITHUB_ENV
          'E2E_EDGE_PORT=3236' >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.MELLODIFAI_ROOT }}/cache/native/downloads
          key: native-win32-x64-${{ hashFiles('ops/lib/native/manifest.json') }}
      - name: Install pinned native artifacts
        run: |
          $env:MELLODIFAI_NATIVE_SEED = ''
          pnpm ops stack.ts install --env e2e --runtime native
          if ($LASTEXITCODE -ne 0) {
            throw 'Native artifact installation failed. Only manifest-pinned publisher URLs are allowed. Local spike archives are unavailable on hosted CI; no substitute download is permitted.'
          }
      - run: pnpm ops stack.ts start --env e2e --runtime native
      - name: Export private lab environment
        shell: bash
        run: |
          set +x
          set -a
          source "$MELLODIFAI_ROOT/stacks/e2e/test.env"
          set +a
          while IFS='=' read -r name _; do
            value="${!name}"
            mask="${value//'%'/'%25'}"
            mask="${mask//$'\r'/'%0D'}"
            mask="${mask//$'\n'/'%0A'}"
            printf '::add-mask::%s\n' "$mask"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < "$MELLODIFAI_ROOT/stacks/e2e/test.env"
      - name: Required native integration and crash tests
        run: pnpm test:native
      - run: pnpm ops stack.ts start --env e2e --runtime native
      - run: pnpm test:db
      - run: pnpm ops rotate-auth-keys.ts --env e2e
      - run: pnpm e2e
      - name: Stop native lab even after failure
        if: always()
        run: pnpm ops stack.ts stop --env e2e --runtime native
