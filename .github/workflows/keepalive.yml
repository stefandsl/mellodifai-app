name: Supabase keepalive
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping hosted REST API
        run: >-
          curl --fail --silent --show-error -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
          "${{ secrets.SUPABASE_URL }}/rest/v1/"
